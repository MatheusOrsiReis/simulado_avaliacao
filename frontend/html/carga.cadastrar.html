<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/carga.cadastrar.js"defer></script>
    <title>Cadastrar Carga</title>
</head>

<body>
    <header>
        <nav>
            <a href="../index.html">Home</a>
        </nav><br><br>
    </header>

    <form>
        <h1>Cadastrar Motorista</h1>

        <label for="descricao">Descrição:</label><br>
        <input type="text" id="descricao"><br><br>


        <label for="peso">Peso:</label><br>
        <input type="text" id="peso"><br><br>


        <label for="volume">Volume:</label><br>
        <input type="text" id="volume"><br><br>

        <label for="codRastreio">Código de Rastreio:</label><br>
        <input type="text" id="codRastreio"><br><br>

        <label for="idMotorista">ID do Motorista Responsável:</label><br>
        <input type="text" id="idMotorista"><br><br>

        <button id="btn_cadastrar">Cadastrar</button>
    </form>
    <div id="resposta"></div>
</body>

</html>
